<svg width="100%" viewBox="0 0 1200 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dTrace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64FFDA" stop-opacity="0"/>
      <stop offset="15%" stop-color="#64FFDA" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#64FFDA" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#64FFDA" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
    </linearGradient>
    <filter id="dGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="15" width="1200" height="1.5" fill="url(#dTrace)"/>
  <g fill="#64FFDA" filter="url(#dGlow)">
    <circle cx="200" cy="16" r="3"/>
    <circle cx="480" cy="16" r="2"/>
    <circle cx="600" cy="16" r="3.5"/>
    <circle cx="720" cy="16" r="2"/>
    <circle cx="1000" cy="16" r="3"/>
  </g>
</svg>
